x-data-platform-env: &data-platform-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omniflow}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-omniflow_dev_only}
  DATA_LAKE_BUCKET: ${DATA_LAKE_BUCKET:-omniflow}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omniflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniflow_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - omniflow_postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      ORDER_SERVICE_DATABASE_URL: ${ORDER_SERVICE_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_orders}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      INVENTORY_SERVICE_DATABASE_URL: ${INVENTORY_SERVICE_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_inventory}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-validator-consumer:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    command: ["python", "-m", "app.validator_consumer"]
    environment:
      ORDER_SERVICE_DATABASE_URL: ${ORDER_SERVICE_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_orders}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      METRICS_PORT: "9102"
    expose:
      - "9102"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  order-outbox-relay:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    command: ["python", "-m", "app.outbox_relay"]
    environment:
      ORDER_SERVICE_DATABASE_URL: ${ORDER_SERVICE_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_orders}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      METRICS_PORT: "9101"
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  inventory-outbox-relay:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    command: ["python", "-m", "app.outbox_relay"]
    environment:
      INVENTORY_SERVICE_DATABASE_URL: ${INVENTORY_SERVICE_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_inventory}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      METRICS_PORT: "9103"
    expose:
      - "9103"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  fulfillment-orchestrator:
    build:
      context: .
      dockerfile: services/fulfillment-orchestrator/Dockerfile
    environment:
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_orchestrator}
      ORCHESTRATOR_ORDER_SERVICE_URL: http://order-service:8000
      ORCHESTRATOR_INVENTORY_SERVICE_URL: http://inventory-service:8000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  fulfillment-orchestrator-consumer:
    build:
      context: .
      dockerfile: services/fulfillment-orchestrator/Dockerfile
    command: ["python", "-m", "app.consumer"]
    environment:
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_orchestrator}
      ORCHESTRATOR_ORDER_SERVICE_URL: http://order-service:8000
      ORCHESTRATOR_INVENTORY_SERVICE_URL: http://inventory-service:8000
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      METRICS_PORT: "9104"
    expose:
      - "9104"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  fulfillment-orchestrator-outbox-relay:
    build:
      context: .
      dockerfile: services/fulfillment-orchestrator/Dockerfile
    command: ["python", "-m", "app.outbox_relay"]
    environment:
      ORCHESTRATOR_DATABASE_URL: ${ORCHESTRATOR_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_orchestrator}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      METRICS_PORT: "9105"
    expose:
      - "9105"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - omniflow_redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./infra/docker/redpanda/create-topics.sh:/usr/local/bin/create-topics.sh:ro
    entrypoint: ["bash", "/usr/local/bin/create-topics.sh"]
    environment:
      REDPANDA_BROKER: redpanda:9092
    restart: "no"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      GATEWAY_ORDER_SERVICE_URL: http://order-service:8000
      GATEWAY_INVENTORY_SERVICE_URL: http://inventory-service:8000
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-120}
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_gateway}
      # Phase 9 (JWT/RBAC, ADR 0009): local-development-only default, never
      # a real secret — see .env.example and DECISIONS.md "Phase 9" for why
      # application code itself has no fallback (fails startup if unset
      # entirely; this compose-level default is the only place a dev value
      # lives, same pattern as every other secret in this file).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-omniflow_dev_only_jwt_secret_change_before_any_shared_use}
      GATEWAY_SEED_ADMIN_PASSWORD: ${GATEWAY_SEED_ADMIN_PASSWORD:-admin_dev_only}
      GATEWAY_SEED_OPS_PASSWORD: ${GATEWAY_SEED_OPS_PASSWORD:-ops_dev_only}
      GATEWAY_SEED_VIEWER_PASSWORD: ${GATEWAY_SEED_VIEWER_PASSWORD:-viewer_dev_only}
      GATEWAY_SEED_SERVICE_PASSWORD: ${GATEWAY_SEED_SERVICE_PASSWORD:-service_dev_only}
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  ops-dashboard:
    build:
      context: .
      dockerfile: services/ops-dashboard/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      fulfillment-orchestrator:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      failure-lab:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx only binds IPv4, but this image's
      # wget resolves "localhost" to ::1 first — see Dockerfile's own
      # HEALTHCHECK comment (this compose-level block overrides that one;
      # both must agree, found by hitting an "unhealthy" dashboard whose
      # every proxied route was actually serving real traffic correctly).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 5s
      retries: 10

  failure-lab:
    build:
      context: .
      dockerfile: services/failure-lab/Dockerfile
    environment:
      FAILURE_LAB_DATABASE_URL: ${FAILURE_LAB_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_failure_lab}
      FAILURE_LAB_API_GATEWAY_URL: http://api-gateway:8000
      FAILURE_LAB_ORDER_SERVICE_URL: http://order-service:8000
      FAILURE_LAB_INVENTORY_SERVICE_URL: http://inventory-service:8000
      FAILURE_LAB_ORCHESTRATOR_SERVICE_URL: http://fulfillment-orchestrator:8000
      # Phase 9 (JWT/RBAC, ADR 0009): must be the exact same shared secret
      # api-gateway signs with — failure-lab only verifies, never issues.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-omniflow_dev_only_jwt_secret_change_before_any_shared_use}
      FAILURE_LAB_GATEWAY_SERVICE_EMAIL: ${GATEWAY_SEED_SERVICE_EMAIL:-failure-lab-service@omniflow.local}
      FAILURE_LAB_GATEWAY_SERVICE_PASSWORD: ${GATEWAY_SEED_SERVICE_PASSWORD:-service_dev_only}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      api-gateway:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      fulfillment-orchestrator:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  failure-lab-poison-consumer:
    build:
      context: .
      dockerfile: services/failure-lab/Dockerfile
    command: ["python", "-m", "app.poison_consumer"]
    environment:
      FAILURE_LAB_DATABASE_URL: ${FAILURE_LAB_DATABASE_URL:-postgresql+psycopg://omniflow:omniflow_dev_only@postgres:5432/omniflow_failure_lab}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      METRICS_PORT: "9109"
    expose:
      - "9109"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-topics:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  # Phase 10 (load testing): k6, gated behind the "load-test" Compose
  # profile so it never starts on a plain `docker compose up`/`make demo` —
  # only `docker compose --profile load-test run --rm k6 ...` (wired by the
  # Makefile's `load-*` targets) brings it up. Talks to api-gateway over the
  # same in-network hostname every other service already uses — real
  # traffic through the real gateway, not a bypass. See
  # docs/phase-10-load-testing.md.
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load-test"]
    environment:
      K6_BASE_URL: http://api-gateway:8000
      K6_INVENTORY_URL: http://inventory-service:8000
    volumes:
      - ./k6:/scripts:ro
      - ./load-test-reports:/reports
    depends_on:
      api-gateway:
        condition: service_healthy
    entrypoint: ["k6"]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/docker/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - omniflow_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-omniflow_dev_only}
    volumes:
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - omniflow_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omniflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-omniflow_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - omniflow_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/docker/minio/create-buckets.sh:/usr/local/bin/create-buckets.sh:ro
    entrypoint: ["bash", "/usr/local/bin/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-omniflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-omniflow_dev_only}
    restart: "no"

  spark-bronze:
    build:
      context: .
      dockerfile: services/data-platform/Dockerfile
    command: ["python", "-m", "app.bronze"]
    environment:
      <<: *data-platform-env
      METRICS_PORT: "9106"
    expose:
      - "9106"
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      redpanda-topics:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  spark-silver:
    build:
      context: .
      dockerfile: services/data-platform/Dockerfile
    command: ["python", "-m", "app.silver"]
    environment:
      <<: *data-platform-env
      METRICS_PORT: "9107"
    expose:
      - "9107"
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      minio-init:
        condition: service_completed_successfully

  spark-gold:
    build:
      context: .
      dockerfile: services/data-platform/Dockerfile
    command: ["python", "-m", "app.gold.runner"]
    environment:
      <<: *data-platform-env
      METRICS_PORT: "9108"
    expose:
      - "9108"
    # Phase 6 (demand forecasting): `app.forecasting`'s local model
    # artifacts (section H) are plain local disk, not MinIO — bind-mounted
    # here so `make forecast-train-baseline`/`forecast-train-model` and a
    # later, separate `make forecast-evaluate`/`forecast-select`/
    # `forecast-forecast` invocation (each its own throwaway `docker compose
    # run` container) still see the same artifact_dir. Gitignored; not a
    # Docker named volume, so `make forecast-clean-safe` can remove it with
    # a plain `rm -rf` like any other local dev output.
    volumes:
      - ./services/data-platform/forecasting_artifacts:/app/services/data-platform/forecasting_artifacts
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      minio-init:
        condition: service_completed_successfully

  lag-poller:
    build:
      context: .
      dockerfile: services/data-platform/Dockerfile
    command: ["python", "-m", "app.lag_poller"]
    environment:
      <<: *data-platform-env
    depends_on:
      redpanda-topics:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  omniflow_postgres_data:
  omniflow_redpanda_data:
  omniflow_prometheus_data:
  omniflow_grafana_data:
  omniflow_minio_data:
