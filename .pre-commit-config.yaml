# Run via `make pre-commit` (a throwaway container — no host Python
# toolchain assumed, see CLAUDE.md). Deliberately does NOT include mypy or
# the per-service test suites: those need each service's runtime deps
# (FastAPI, SQLAlchemy, PySpark, ...) and a live Postgres, which is a much
# heavier ask than a pre-commit hook should make on every run — they stay as
# separate `make typecheck` / `make test` steps, both still gated in
# .github/workflows/ci.yml. This file covers what's cheap and universal:
# formatting, linting, and repo hygiene.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
