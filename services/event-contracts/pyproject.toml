[project]
name = "omniflow-event-contracts"
version = "0.1.0"
description = "Shared versioned event envelope and event-type constants for OmniFlow"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["event_contracts*"]
