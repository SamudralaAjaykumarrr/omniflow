# Serves the built SPA and reverse-proxies same-origin so the browser never
# needs CORS configuration on any backend service (docs/phase-7-ops-dashboard.md
# "API integration approach"). Location prefixes match src/api/client.ts's
# API_BASE and vite.config.ts's dev-server proxy exactly.
#
# proxy_pass targets are set via variables, not a bare hostname, so nginx
# resolves them at REQUEST time (via Docker's embedded DNS at 127.0.0.11)
# instead of once at startup — a static `proxy_pass http://api-gateway:8000/`
# makes nginx refuse to start at all ("host not found in upstream") if that
# one hostname isn't resolvable yet when this container starts, which would
# take down the whole dashboard (including the static SPA) over one
# not-yet-ready dependency. The variable form instead returns a 502 for just
# that one route until its upstream is reachable.
#
# A second, related gotcha (found running this for real against the live
# stack, not just `nginx -t`): nginx only strips a location's matched prefix
# automatically when proxy_pass's target is a literal URI — with a
# *variable* target (required for the deferred-resolution fix above), nginx
# instead forwards the client's full original URI unchanged, so
# `GET /gw/healthz` would reach api-gateway as `/gw/healthz` (a real 404,
# not the intended `/healthz`). Each location below strips its own prefix
# explicitly with `rewrite ... break` before `proxy_pass` forwards the
# now-rewritten `$uri` (query string preserved).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets: content-hashed by Vite, safe to cache long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any non-API, non-asset path resolves to index.html so
    # client-side routes (e.g. /orders/<uuid>) survive a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    location /gw/ {
        # `set` must come before `rewrite ... break` — `break` halts every
        # remaining rewrite-phase directive in this location (including a
        # `set` after it), which left $upstream_gateway uninitialized and
        # every proxied request 500-ing ("invalid URL prefix in ''") the
        # first time this ran against the live stack. Order matters here.
        set $upstream_gateway http://api-gateway:8000;
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass $upstream_gateway;
        include /etc/nginx/proxy_params.conf;
    }

    location /inventory-api/ {
        set $upstream_inventory http://inventory-service:8000;
        rewrite ^/inventory-api/(.*)$ /$1 break;
        proxy_pass $upstream_inventory;
        include /etc/nginx/proxy_params.conf;
    }

    location /orchestrator-api/ {
        set $upstream_orchestrator http://fulfillment-orchestrator:8000;
        rewrite ^/orchestrator-api/(.*)$ /$1 break;
        proxy_pass $upstream_orchestrator;
        include /etc/nginx/proxy_params.conf;
    }

    location /prom-api/ {
        set $upstream_prometheus http://prometheus:9090;
        rewrite ^/prom-api/(.*)$ /$1 break;
        proxy_pass $upstream_prometheus;
        include /etc/nginx/proxy_params.conf;
    }
}
